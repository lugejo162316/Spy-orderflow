<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPY Order Flow</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0c0f}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:#1e2530;border-radius:2px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const C = {
      bg:"#0a0c0f",panel:"#0f1318",border:"#1e2530",
      green:"#00e5a0",red:"#ff4466",yellow:"#f5c518",
      blue:"#4da6ff",purple:"#b388ff",text:"#d8e4f0",
      muted:"#6b7c93",bright:"#ffffff",orange:"#ff9f43"
    };
    const TOKEN = "YOUR_TRADIER_KEY_HERE";
    const BASE = "https://api.tradier.com/v1";
    const font = "'Inter',sans-serif";
    const rand = (a,b) => Math.random()*(b-a)+a;
    const clamp = (v,a,b) => Math.min(Math.max(v,a),b);
    const fmtP = n => n>=1000000?`$${(n/1000000).toFixed(2)}M`:n>=1000?`$${(n/1000).toFixed(0)}K`:`$${n}`;

    async function getSPYQuote(){
      try{
        const r = await fetch(`${BASE}/markets/quotes?symbols=SPY`,{headers:{Authorization:`Bearer ${TOKEN}`,Accept:"application/json"}});
        const d = await r.json();
        const q = d?.quotes?.quote;
        return {price:q?.last??q?.close??578,change:q?.change??0,pct:q?.change_percentage??0};
      }catch{return {price:578,change:0,pct:0};}
    }
    async function getExpirations(){
      try{
        const r = await fetch(`${BASE}/markets/options/expirations?symbol=SPY`,{headers:{Authorization:`Bearer ${TOKEN}`,Accept:"application/json"}});
        const d = await r.json();
        return d?.expirations?.date??[];
      }catch{return [];}
    }
    async function getChain(exp){
      try{
        const r = await fetch(`${BASE}/markets/options/chains?symbol=SPY&expiration=${exp}&greeks=true`,{headers:{Authorization:`Bearer ${TOKEN}`,Accept:"application/json"}});
        const d = await r.json();
        return d?.options?.option??[];
      }catch{return [];}
    }

    function buildSignal(chain,price){
      if(!chain.length)return null;
      const near = chain.filter(o=>Math.abs(o.strike-price)<price*0.04);
      const calls = near.filter(o=>o.option_type==="call");
      const puts  = near.filter(o=>o.option_type==="put");
      const cv = calls.reduce((a,o)=>a+(o.volume||0),0);
      const pv = puts.reduce((a,o)=>a+(o.volume||0),0);
      const pcr = cv>0?+(pv/cv).toFixed(2):1.0;
      const ucalls = chain.filter(o=>o.option_type==="call"&&(o.volume||0)>(o.open_interest||0)*0.4&&(o.volume||0)>50);
      const uputs  = chain.filter(o=>o.option_type==="put" &&(o.volume||0)>(o.open_interest||0)*0.4&&(o.volume||0)>50);
      const coi = calls.reduce((a,o)=>a+(o.open_interest||0),0);
      const poi = puts.reduce((a,o)=>a+(o.open_interest||0),0);
      let score=0;
      if(pcr<0.7)score+=2;else if(pcr<0.9)score+=1;
      else if(pcr>1.3)score-=2;else if(pcr>1.1)score-=1;
      if(ucalls.length>uputs.length+1)score+=1;
      else if(uputs.length>ucalls.length+1)score-=1;
      const map=[
        {min:2.5,label:"STRONG BUY",color:C.green,icon:"▲▲",strength:5},
        {min:1,label:"BUY",color:C.green,icon:"▲",strength:4},
        {min:-0.5,label:"NEUTRAL",color:C.yellow,icon:"◆",strength:3},
        {min:-2,label:"SELL",color:C.red,icon:"▼",strength:2},
        {min:-999,label:"STRONG SELL",color:C.red,icon:"▼▼",strength:1},
      ];
      const s=map.find(m=>score>=m.min);
      return {...s,pcr,cv,pv,coi,poi,ucalls,uputs};
    }

    function getAdvice(label){
      return {
        "STRONG BUY":"Heavy call buying on SPY. Action: buy a call 1–2 strikes above current price, 7–14 days out. Risk max $100–150.",
        "BUY":"More calls than puts. Bullish flow. Action: consider a call option with 7–14 days to expiry.",
        "NEUTRAL":"Mixed signals. No clear edge. Action: stay flat and wait for a clearer setup.",
        "SELL":"Put flow elevated. Action: consider a put 1–2 strikes below current price, 7–14 days out.",
        "STRONG SELL":"Aggressive put buying. Action: buy puts. Avoid buying calls right now.",
      }[label]||"";
    }

    function getTimeOfDay(){
      const h=new Date().getHours(),m=new Date().getMinutes();
      if(h<9||(h===9&&m<30))return{label:"Pre-Market",color:C.yellow,tip:"Market not open yet. Wait for 9:30 AM."};
      if(h===9)return{label:"Market Open",color:C.orange,tip:"Very volatile. Many traders wait 15–30 min after open."};
      if(h>=10&&h<12)return{label:"Morning Session",color:C.green,tip:"Best time to trade. Volume and trends are usually clear."};
      if(h>=12&&h<14)return{label:"Lunch Hours",color:C.yellow,tip:"Volume drops. Signals less reliable right now."};
      if(h>=14&&h<15)return{label:"Afternoon",color:C.green,tip:"Volume picking back up. Good window if signal is clear."};
      if(h>=15&&h<16)return{label:"Power Hour",color:C.orange,tip:"Big moves but also big reversals. Be careful."};
      return{label:"After Hours",color:C.muted,tip:"Market closed. Review today and plan for tomorrow."};
    }

    function Card({children,mt=0}){
      return <div style={{margin:`${mt}px 16px 14px`,background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>{children}</div>;
    }
    function CardHead({title,sub}){
      return(
        <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>{title}</span>
          {sub&&<span style={{fontSize:11,color:C.muted}}>{sub}</span>}
        </div>
      );
    }
    function Row({label,sub,val,valColor,last}){
      return(
        <div style={{padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:last?"none":`1px solid ${C.border}`}}>
          <div>
            <div style={{fontSize:14,fontWeight:600,color:C.bright,marginBottom:sub?3:0}}>{label}</div>
            {sub&&<div style={{fontSize:12,color:C.muted,maxWidth:240,lineHeight:1.4}}>{sub}</div>}
          </div>
          {val!==undefined&&<div style={{fontSize:17,fontWeight:700,color:valColor||C.bright,marginLeft:12,whiteSpace:"nowrap"}}>{val}</div>}
        </div>
      );
    }

    function App(){
      const [quote,setQuote] = React.useState({price:578,change:0,pct:0});
      const [chain,setChain] = React.useState([]);
      const [signal,setSignal] = React.useState(null);
      const [exps,setExps] = React.useState([]);
      const [selExp,setSelExp] = React.useState(null);
      const [loading,setLoading] = React.useState(true);
      const [error,setError] = React.useState(null);
      const [tab,setTab] = React.useState("overview");
      const [lastUpdate,setLastUpdate] = React.useState(null);
      const timer = React.useRef(null);

      const refresh = async(exp) => {
        try{
          const [q,ch] = await Promise.all([getSPYQuote(),exp?getChain(exp):Promise.resolve([])]);
          setQuote(q);setChain(ch);setSignal(buildSignal(ch,q.price));
          setLastUpdate(new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}));
          setError(null);
        }catch{setError("Could not load data.");}
        finally{setLoading(false);}
      };

      React.useEffect(()=>{
        (async()=>{
          setLoading(true);
          const e = await getExpirations();
          setExps(e);
          const first=e[1]||e[0];
          setSelExp(first);
          await refresh(first);
        })();
      },[]);

      React.useEffect(()=>{
        clearInterval(timer.current);
        if(selExp){timer.current=setInterval(()=>refresh(selExp),30000);}
        return()=>clearInterval(timer.current);
      },[selExp]);

      const tod=getTimeOfDay();
      const up=quote.change>=0;
      const unusual=[...(signal?.ucalls||[]),...(signal?.uputs||[])].sort((a,b)=>(b.volume||0)-(a.volume||0)).slice(0,10);
      const tabs=["overview","flow","unusual"];

      if(loading)return(
        <div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:font}}>
          <div style={{fontSize:28,marginBottom:16}}>🐋</div>
          <div style={{fontSize:14,color:C.muted}}>Loading live SPY data...</div>
        </div>
      );

      return(
        <div style={{background:C.bg,minHeight:"100vh",fontFamily:font,color:C.text,maxWidth:480,margin:"0 auto"}}>
          <div style={{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"16px 18px 14px",position:"sticky",top:0,zIndex:100}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:13,fontWeight:700,letterSpacing:"0.15em",color:C.muted,textTransform:"uppercase"}}>SPY Order Flow</span>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {error
                  ?<span style={{fontSize:12,color:C.red,fontWeight:600}}>⚠ OFFLINE</span>
                  :<><span style={{width:8,height:8,borderRadius:"50%",background:C.green,display:"inline-block",animation:"pulse 1.4s ease-in-out infinite"}}/><span style={{fontSize:12,color:C.green,fontWeight:600}}>LIVE</span></>
                }
              </div>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:4}}>
              <span style={{fontSize:32,fontWeight:800,color:C.bright,letterSpacing:"-0.03em"}}>${quote.price.toFixed(2)}</span>
              <span style={{fontSize:15,fontWeight:600,color:up?C.green:C.red}}>{up?"▲":"▼"} {Math.abs(quote.change).toFixed(2)} ({Math.abs(quote.pct).toFixed(2)}%)</span>
            </div>
            <div style={{fontSize:12,color:C.muted}}>SPY · updated {lastUpdate}</div>
            {exps.length>0&&(
              <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:12,color:C.muted}}>Expiry:</span>
                <select value={selExp||""} onChange={e=>{setSelExp(e.target.value);setLoading(true);refresh(e.target.value);}} style={{background:C.bg,color:C.bright,border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 8px",fontSize:12,fontFamily:font}}>
                  {exps.slice(0,8).map(e=><option key={e} value={e}>{e}</option>)}
                </select>
                <span style={{fontSize:11,color:C.muted}}>Pick 7–14 days out</span>
              </div>
            )}
          </div>

          <div style={{display:"flex",background:C.panel,borderBottom:`1px solid ${C.border}`,position:"sticky",top:130,zIndex:99}}>
            {tabs.map(t=>(
              <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"12px 0",fontSize:12,fontWeight:tab===t?700:500,textAlign:"center",cursor:"pointer",textTransform:"capitalize",color:tab===t?C.bright:C.muted,borderBottom:tab===t?`2px solid ${C.blue}`:"2px solid transparent",background:"none",border:"none",fontFamily:font}}>
                {t==="unusual"?"Unusual Flow":t}
              </button>
            ))}
          </div>

          {error&&<div style={{margin:"14px 16px",background:`${C.red}15`,border:`1px solid ${C.red}`,borderRadius:10,padding:"12px 16px",fontSize:13,color:C.text}}>⚠️ {error}</div>}

          {tab==="overview"&&(
            <>
              {signal?(
                <div style={{background:`${signal.color}15`,border:`2px solid ${signal.color}`,borderRadius:12,padding:"16px 18px",margin:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:6}}>ORDER FLOW SIGNAL · SPY</div>
                    <div style={{fontSize:24,fontWeight:800,color:signal.color,marginBottom:8}}>{signal.icon} {signal.label}</div>
                    <div style={{display:"flex",gap:4,alignItems:"center"}}>
                      {[1,2,3,4,5].map(i=><div key={i} style={{width:10,height:10,borderRadius:3,background:i<=signal.strength?signal.color:C.border}}/>)}
                      <span style={{fontSize:11,color:C.muted,marginLeft:8}}>CONVICTION</span>
                    </div>
                  </div>
                  <div style={{fontSize:40,color:signal.color,opacity:0.3}}>{signal.icon}</div>
                </div>
              ):(
                <div style={{margin:"14px 16px",background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:16,fontSize:14,color:C.muted,textAlign:"center"}}>Select an expiry to load signal</div>
              )}
              <Card>
                <CardHead title="Time of Day"/>
                <div style={{padding:"14px 16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <span style={{fontSize:16,fontWeight:700,color:C.bright}}>{tod.label}</span>
                    <span style={{background:`${tod.color}22`,color:tod.color,borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:700}}>{new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}</span>
                  </div>
                  <div style={{fontSize:13,color:C.text,lineHeight:1.7}}>{tod.tip}</div>
                </div>
              </Card>
              {signal&&(
                <Card>
                  <CardHead title="What To Do"/>
                  <div style={{padding:16,fontSize:14,lineHeight:1.8,color:C.text}}>{getAdvice(signal.label)}</div>
                  <div style={{padding:"0 16px 14px",fontSize:12,color:C.muted}}>💡 Never risk more than $100–150 per trade while learning.</div>
                </Card>
              )}
            </>
          )}

          {tab==="flow"&&signal&&(
            <>
              <Card mt={14}>
                <CardHead title="Options Flow" sub={selExp}/>
                <Row label="Put/Call Ratio" sub={signal.pcr<0.8?"Very Bullish":signal.pcr<1.0?"Bullish":signal.pcr<1.2?"Neutral":"Bearish"} val={signal.pcr.toFixed(2)} valColor={signal.pcr<0.9?C.green:signal.pcr>1.2?C.red:C.yellow}/>
                <Row label="Call Volume" val={signal.cv.toLocaleString()} valColor={C.green}/>
                <Row label="Put Volume" val={signal.pv.toLocaleString()} valColor={C.red}/>
                <Row label="Call Open Interest" val={signal.coi.toLocaleString()} valColor={C.green}/>
                <Row label="Put Open Interest" val={signal.poi.toLocaleString()} valColor={C.red} last/>
              </Card>
              <Card>
                <CardHead title="Unusual Activity"/>
                <Row label="Unusual Call Spikes" val={signal.ucalls.length} valColor={C.green}/>
                <Row label="Unusual Put Spikes" val={signal.uputs.length} valColor={C.red} last/>
              </Card>
            </>
          )}

          {tab==="unusual"&&(
            <Card mt={14}>
              <CardHead title="Unusual Options Flow" sub="SPY · Live"/>
              {unusual.length===0?(
                <div style={{padding:20,textAlign:"center",fontSize:13,color:C.muted}}>No unusual flow detected. Try a different expiry.</div>
              ):unusual.map((o,i)=>(
                <div key={i} style={{padding:"12px 16px",borderBottom:i<unusual.length-1?`1px solid ${C.border}`:"none"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:15,fontWeight:700,color:C.bright}}>SPY ${o.strike} {selExp} {o.option_type?.toUpperCase()}</span>
                    <span style={{background:`${o.option_type==="call"?C.green:C.red}22`,color:o.option_type==="call"?C.green:C.red,borderRadius:6,padding:"3px 10px",fontSize:13,fontWeight:700}}>{o.option_type?.toUpperCase()}</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.muted}}>
                    <span>Vol: {(o.volume||0).toLocaleString()} · OI: {(o.open_interest||0).toLocaleString()}</span>
                    <span style={{color:C.purple,fontWeight:600}}>{o.ask?`$${(o.ask*100).toFixed(0)}/contract`:""}</span>
                  </div>
                </div>
              ))}
            </Card>
          )}

          <div style={{padding:16,textAlign:"center",fontSize:11,color:C.muted,lineHeight:1.8}}>
            LIVE DATA VIA TRADIER · NOT FINANCIAL ADVICE
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
